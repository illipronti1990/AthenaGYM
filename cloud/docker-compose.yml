# ATHENAS GYM — banco PostgreSQL (opcional; local usa SQLite por padrão)
services:
  db:
    image: postgres:16-alpine
    container_name: athenas-postgres
    environment:
      POSTGRES_DB: athenas
      POSTGRES_USER: athenas
      POSTGRES_PASSWORD: athenas
    ports:
      - "5432:5432"
    volumes:
      - athenas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athenas -d athenas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  athenas_pg:
