# Blueprint na raiz do GitHub (Render detecta automaticamente)
# Worker BullMQ long-running; API/web na Vercel (movvoerp.com.br)

services:
  - type: web
    name: movvo-worker
    runtime: docker
    plan: free
    region: oregon
    rootDir: platform
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_URL
        value: https://api.movvoerp.com.br/api/v1
      - key: OTEL_SERVICE_NAME
        value: movvo-worker
