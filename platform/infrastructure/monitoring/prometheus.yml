global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: athenas-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3001']
