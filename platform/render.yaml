# Render Blueprint — worker BullMQ (API fica na Vercel)
# Docs: https://render.com/docs/blueprint-spec
# Root Directory no painel: platform

services:
  - type: web
    name: movvo-worker
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_URL
        value: https://api.movvoerp.com.br/api/v1
      - key: OTEL_SERVICE_NAME
        value: movvo-worker
